<div class="main-wrapper">

  <!-- partial:sidebar -->
  <app-sidebar />
  <!-- partial -->

  <div class="page-wrapper" appResizeBroadcast>

    <!-- partial:navbar -->
    <app-navbar></app-navbar>
    <!-- partial -->

    <div class="workspace-tabs-row">
      <app-tabs></app-tabs>
    </div>

    <div class="page-content container-xxl workspace-page-content">

      <!-- Spinner du chargement différé (lazy load) : superposé à la page, sans
           retirer le router-outlet (la page d'un onglet conservé serait détruite). -->
      @if (isLoading) {
        <div class="spinner-wrapper lazy-load-spinner">
          <div class="spinner">Loading...</div>
        </div>
      }
      <div [class.d-none]="isLoading">
        <router-outlet></router-outlet>
      </div>


    </div>

    <!-- partial:footer -->
    <app-footer></app-footer>
    <!-- partial -->

  </div>


</div>
