<div class="workspace-tabs-bar">
  <button
    type="button"
    class="workspace-tabs-list-btn"
    aria-haspopup="menu"
    [attr.aria-expanded]="tabsList() !== null"
    aria-label="Liste des onglets ouverts"
    title="Liste des onglets ouverts"
    [class.is-open]="tabsList() !== null"
    (click)="toggleTabsList($event)">
    <lucide-icon [img]="listIcon" [size]="16" />
  </button>

  <div class="workspace-tabs" role="tablist" aria-label="Pages ouvertes" (scroll)="closeContextMenu()">
    @for (tab of tabs(); track tab.id) {
      <div class="workspace-tab" [class.is-active]="tab.id === activeTabId()" (contextmenu)="openContextMenu($event, tab.id)">
        <button
          type="button"
          class="workspace-tab-trigger"
          role="tab"
          aria-haspopup="menu"
          [attr.aria-selected]="tab.id === activeTabId()"
          [attr.tabindex]="tab.id === activeTabId() ? 0 : -1"
          [title]="tab.title + ' — clic droit : options de fermeture'"
          (click)="activateTab(tab.id)"
          (keydown)="handleTabKeydown($event, tab.id)">
          @if (dirtyUrls().has(tab.url)) {
            <span class="workspace-tab-dirty" role="img" aria-label="Modifications non enregistrées" title="Modifications non enregistrées"></span>
          }
          @if (tabIcons().get(tab.id); as icon) {
            <lucide-icon [img]="icon" [size]="15" class="workspace-tab-icon" aria-hidden="true" />
          }
          <span class="workspace-tab-label">{{ tab.title }}</span>
        </button>

        @if (tab.closable) {
          <button
            type="button"
            class="workspace-tab-close"
            [attr.aria-label]="'Fermer ' + tab.title"
            [title]="'Fermer ' + tab.title"
            (click)="closeTab($event, tab.id)">
            <lucide-icon [img]="closeIcon" [size]="14" />
          </button>
        }
      </div>
    }
  </div>
</div>

@if (tabsList(); as list) {
  <div
    class="workspace-tabs-list"
    role="menu"
    aria-label="Onglets ouverts"
    [style.top.px]="list.top"
    [style.left.px]="list.left"
    (click)="$event.stopPropagation()">
    @for (tab of tabs(); track tab.id) {
      <div class="workspace-tabs-list-row" [class.is-active]="tab.id === activeTabId()">
        <button type="button" role="menuitem" class="workspace-tabs-list-item" [title]="tab.title" (click)="selectFromList(tab.id)">
          @if (dirtyUrls().has(tab.url)) {
            <span class="workspace-tab-dirty" role="img" aria-label="Modifications non enregistrées" title="Modifications non enregistrées"></span>
          }
          @if (tabIcons().get(tab.id); as icon) {
            <lucide-icon [img]="icon" [size]="15" class="workspace-tab-icon" aria-hidden="true" />
          }
          <span class="workspace-tab-label">{{ tab.title }}</span>
        </button>
        @if (tab.closable) {
          <button type="button" class="workspace-tabs-list-close" [attr.aria-label]="'Fermer ' + tab.title" [title]="'Fermer ' + tab.title" (click)="closeFromList($event, tab.id)">
            <lucide-icon [img]="closeIcon" [size]="14" />
          </button>
        }
      </div>
    }
  </div>
}

@if (contextMenu(); as menu) {
  <div
    class="workspace-tab-menu"
    role="menu"
    [attr.aria-label]="'Options de l\'onglet ' + menu.title"
    [style.top.px]="menu.top"
    [style.left.px]="menu.left"
    (click)="$event.stopPropagation()">
    @for (action of menu.actions; track action.label) {
      <button
        type="button"
        role="menuitem"
        class="workspace-tab-menu-item"
        [disabled]="action.disabled"
        (click)="runAction(action)">
        {{ action.label }}
      </button>
    }
  </div>
}
