<div class="container-xxl">
  <div class="row w-100 mx-0 auth-page">
    <div class="col-md-10 col-lg-8 col-xl-6 mx-auto">
      <div class="card">
        <div class="row">
          <div class="col-md-4 pe-md-0">
            <div class="auth-side-wrapper" [style.background-image]="'url(https://placehold.co/250x650)'">
  
            </div>
          </div>
          <div class="col-md-8 ps-md-0">
            <div class="auth-form-wrapper px-4 py-5">
              <a routerLink="." class="nobleui-logo d-block mb-2">Noble<span>UI</span></a>
              <h4 class="mb-4">Forgot your password?</h4>
              <p class="mb-4 text-secondary">
                Enter your email address and we'll send you instructions for resetting your password.
              </p>
              <form class="forms-sample">
                <div class="mb-3">
                  <label for="exampleInputEmail1" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Email" value="admin@demo.com">
                </div>
                @if (successMessage) {
                  <div class="alert alert-success mb-3" role="alert">{{ successMessage }}</div>
                }
                @if (errorMessage) {
                  <div class="alert alert-danger mb-3" role="alert">{{ errorMessage }}</div>
                }
                <div>
                  <button
                    type="submit"
                    class="btn btn-primary me-2 mb-2 mb-md-0"
                    (click)="onResetPassword($event)"
                    [disabled]="loading"
                    [attr.aria-busy]="loading"
                  >
                    @if (loading) {
                      <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                      Sending...
                    } @else {
                      Reset Password
                    }
                  </button>
                  <button type="button" (click)="onBackToLogin($event)" class="btn btn-link" [disabled]="loading">Back to Login</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
