<div class="row inbox-wrapper">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">
        <div class="row">
          <div class="col-lg-3 border-end-lg">
            <div class="d-flex align-items-center justify-content-between">
              <button class="navbar-toggle btn btn-icon border d-inline-flex d-lg-none" type="button" (click)="isAsideNavCollapsed = !isAsideNavCollapsed" [attr.aria-expanded]="!isAsideNavCollapsed" aria-controls="asideNav">
                <lucide-icon [img]="chevronDownIcon" />
              </button>
              <div class="order-first">
                <h4>Mail Service</h4>
                <p class="text-secondary">amiahburton&#64;gmail.com</p>
              </div>
            </div>
            <div class="d-grid my-3">
              <a class="btn btn-primary" routerLink="/apps/email/compose">Compose Email</a>
            </div>
            <div class="email-aside-nav" id="asideNav" [ngbCollapse]="isAsideNavCollapsed">
              <ul class="nav flex-column">
              <li class="nav-item" [class.active]="inbox.isActive">
                  <a class="nav-link d-flex align-items-center" routerLink="/apps/email/inbox" routerLinkActive="active" #inbox="routerLinkActive">
                    <lucide-icon [img]="inboxIcon" class="icon-lg me-2" />
                    Inbox
                    <span class="badge bg-danger fw-bolder ms-auto">2</span>
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center" href="" (click)="false">
                    <lucide-icon [img]="mailIcon" class="icon-lg me-2" />
                    Sent Mail
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center" href="" (click)="false">
                    <lucide-icon [img]="briefcaseIcon" class="icon-lg me-2" />
                    Important
                    <span class="badge bg-secondary fw-bolder ms-auto">4</span>
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center" href="" (click)="false">
                    <lucide-icon [img]="fileIcon" class="icon-lg me-2" />
                    Drafts
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center" href="" (click)="false">
                    <lucide-icon [img]="starIcon" class="icon-lg me-2" />
                    Tags
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center" href="" (click)="false">
                    <lucide-icon [img]="trashIcon" class="icon-lg me-2" />
                    Trash
                  </a>
                </li>
              </ul>
              <p class="text-secondary fs-12px fw-bolder text-uppercase mb-2 mt-4">Labels</p>
              <ul class="nav flex-column">
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center" href="" (click)="false">
                    <lucide-icon [img]="tagIcon" class="text-warning icon-lg me-2" />
                    Important
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center" href="" (click)="false">
                    <lucide-icon [img]="tagIcon" class="text-primary icon-lg me-2" />
                    Business
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link d-flex align-items-center" href="" (click)="false">
                    <lucide-icon [img]="tagIcon" class="text-info icon-lg me-2" />
                    Inspiration
                  </a>
                </li>
              </ul>
            </div>
          </div>
          <div class="col-lg-9">
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
