<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a routerLink=".">Advanced UI</a></li>
    <li class="breadcrumb-item active" aria-current="page">Sweet Alert</li>
  </ol>
</nav>

<div class="row">
  <div class="col-md-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Ngx-SweetAlert2</h4>
        <p class="text-secondary">Read the <a href="https://github.com/sweetalert2/ngx-sweetalert2" target="_blank" rel="noopener noreferrer"> Official Ngx-SweetAlert2 Documentation </a>for a full list of instructions and other options.</p>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-4 grid-margin stretch-card">
    <div class="card">
      <div class="card-body d-flex flex-column align-items-center">
        <p class="text-secondary mb-3">Basic Alert</p>
        <button [swal]="basicAlertSwal" class="btn btn-primary">
          Click here!
        </button>
      </div>
    </div>
  </div>
  <div class="col-md-4 grid-margin stretch-card">
    <div class="card">
      <div class="card-body d-flex flex-column align-items-center">
        <p class="text-secondary mb-3">A title with a text under</p>
        <button [swal]="titleTextSwal" class="btn btn-primary">
          Click here!
        </button>
      </div>
    </div>
  </div>
  <div class="col-md-4 grid-margin stretch-card">
    <div class="card">
      <div class="card-body d-flex flex-column align-items-center">
        <p class="text-secondary mb-3">Mixin example</p>
        <button [swal]="mixinSwal" class="btn btn-primary">
          Click here!
        </button>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-4 grid-margin stretch-card">
    <div class="card">
      <div class="card-body d-flex flex-column align-items-center">
        <p class="text-secondary mb-3">Custom HTML description and buttons</p>
        <button [swal]="htmlExampleSwal" class="btn btn-primary">
          Click here!
        </button>
      </div>
    </div>
  </div>
  <div class="col-md-4 grid-margin stretch-card">
    <div class="card">
      <div class="card-body d-flex flex-column align-items-center">
        <p class="text-secondary mb-3">Custom position</p>
        <button [swal]="customPositionSwal" class="btn btn-primary">
          Click here!
        </button>
      </div>
    </div>
  </div>
  <div class="col-md-4 grid-margin stretch-card">
    <div class="card">
      <div class="card-body d-flex flex-column align-items-center">
        <p class="text-secondary mb-3">A message with auto close timer</p>
        <button type="button" (click)="showAutoCloseAlert()" class="btn btn-primary">
          Click here!
        </button>
      </div>
    </div>
  </div>
</div>
